[workspace]
members = [
  "crates/sonicfetch-core",
  "crates/sonicfetch-engine",
  "crates/sonicfetch-storage",
  "crates/sonicfetch-desktop",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Abu Zahed (0xzahed)"]

[workspace.dependencies]
anyhow = "1.0.100"
thiserror = "2.0.17"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "signal"] }
tokio-util = "0.7.16"
reqwest = { version = "0.12.24", default-features = false, features = ["stream", "rustls-tls-native-roots"] }
url = "2.5.7"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["fmt", "env-filter"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
uuid = { version = "1.18.1", features = ["v4"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
libc = "0.2.177"

[profile.release]
lto = "thin"
codegen-units = 1
